name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Install the packed tarball and run the command
        shell: bash
        run: |
          set -e
          npm pack --silent
          npm install --global "./$(ls *.tgz)"
          portwho --version
          set +e
          portwho not-a-port >/dev/null 2>&1
          [ "$?" = 2 ] && echo "exit codes verified"
